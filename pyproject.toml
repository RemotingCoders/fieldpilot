[project]
name = "fieldpilot"
version = "0.1.0"
description = "An autonomous field service dispatch agent built on Gemini, ADK and Google Cloud."
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "ortools>=9.10",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "google-cloud-storage>=2.16",
    "python-multipart>=0.0.9",
]
# Firestore and Pub/Sub were listed here from day one and nothing ever
# imported them. Declaring products you do not use is the dependency-file
# version of an inflated claim; they return here the day code does.

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
fieldpilot = "fieldpilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
